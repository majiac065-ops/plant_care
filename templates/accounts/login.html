{% extends 'base.html' %}
{% load static %}

{% block title %}User Login - PlantCare{% endblock %}

{% block content %}
<style>
  .login-bg-container {
    background-image: url("{% static 'images/picc.jpeg' %}");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    min-height: calc(100vh - 80px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    margin: -1.5rem -1.5rem 0 -1.5rem; /* Bootstrap container padding ഒഴിവാക്കാൻ */
  }
  .login-card-custom {
    background: #ffffff;
    width: 100%;
    max-width: 420px;
    border-radius: 18px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
    padding: 35px 30px;
  }

  .btn-green-login {
    background-color: #2d6a4f !important;
    color: white !important;
    border-radius: 8px;
    font-weight: 500;
  }
  .btn-green-login:hover {
    background-color: #1b4332 !important;
  }
</style>

<div class="login-bg-container">
  <div class="login-card-custom">
    
    <!-- Logo & Title -->
    <div class="text-center mb-3">
      <div class="text-success mb-1" style="font-size: 2.2rem; color: #2d6a4f !important;">
        <i class="bi bi-flower3"></i>
      </div>
      <h4 class="fw-bold mb-0" style="color: #2d6a4f;">PlantCare</h4>
      <small class="text-muted d-block mb-3" style="font-size: 0.78rem;">Smart Plant Care System</small>
      <hr class="opacity-25 my-2">
      <h6 class="fw-bold text-dark mt-3 mb-0">Welcome Back</h6>
    </div>

    <!-- Login Form -->
    <form method="POST">
      {% csrf_token %}
      
      <div class="mb-3 text-start">
        <label for="id_username" class="form-label small fw-semibold text-muted mb-1">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
          <input type="text" name="username" id="id_username" class="form-control bg-light border-start-0" placeholder="Enter your username" required autofocus>
        </div>
      </div>

      <div class="mb-4 text-start">
        <label for="id_password" class="form-label small fw-semibold text-muted mb-1">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" id="id_password" class="form-control bg-light border-start-0" placeholder="Enter your password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-green-login w-100 py-2 mb-3">
        <i class="bi bi-box-arrow-in-right me-1"></i> Login
      </button>

      <div class="text-center small text-muted">
        Don't have an account? <a href="{% url 'register' %}" class="text-decoration-none fw-bold" style="color: #2d6a4f;">Sign Up</a>
      </div>
    </form>

  </div>
</div>
{% endblock %}
