{% extends 'base.html' %}

{% block title %}User Login - PlantCare{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-6 col-lg-5">
    <div class="card card-plantcare shadow-sm">
      <div class="card-header card-header-green text-center">
        <h4 class="mb-0"><i class="bi bi-box-arrow-in-right me-2"></i> User Login</h4>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_username" class="form-label font-weight-bold">Username</label>
            <input type="text" name="username" class="form-control form-control-lg" placeholder="Enter your username" required id="id_username">
          </div>
          <div class="mb-4">
            <label for="id_password" class="form-label font-weight-bold">Password</label>
            <input type="password" name="password" class="form-control form-control-lg" placeholder="Enter password" required id="id_password">
          </div>
          <button type="submit" class="btn btn-green w-100 btn-lg mb-3">
            <i class="bi bi-shield-lock me-1"></i> Log In
          </button>
        </form>
        <hr>
        <p class="text-center mb-0 text-muted">
          Don't have an account? <a href="{% url 'register' %}" class="text-success fw-bold">Sign Up Here</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
