{% if messages %}
  <div class="row mb-3">
    <div class="col-12">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show glass-card border-0 shadow-sm d-flex align-items-center gap-2 mb-2 p-3" role="alert">
          {% if message.tags == 'success' %}
            <i class="bi bi-check-circle-fill text-success fs-5"></i>
          {% elif message.tags == 'danger' or message.tags == 'error' %}
            <i class="bi bi-exclamation-octagon-fill text-danger fs-5"></i>
          {% elif message.tags == 'warning' %}
            <i class="bi bi-exclamation-triangle-fill text-warning fs-5"></i>
          {% else %}
            <i class="bi bi-info-circle-fill text-info fs-5"></i>
          {% endif %}
          <div class="flex-grow-1 font-weight-semibold">{{ message }}</div>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    </div>
  </div>
{% endif %}
